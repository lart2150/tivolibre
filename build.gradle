plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.lart2150'
version = '0.8.0'
description = 'TivoLibre is a Java library for decoding TiVo files to standard MPEG files'

java {
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    // Build with whatever JDK runs Gradle (17 or newer) but emit bytecode the documented minimum
    // runtime can load. Deliberately not a toolchain: Gradle matches a toolchain languageVersion
    // exactly, so pinning one without a provisioning resolver fails for anyone whose only JDK is
    // a different release, and options.release already fixes the target.
    options.release = 11
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    // These sources predate strict doclint; missing @param tags shouldn't fail a release build.
    options.addStringOption('Xdoclint:none', '-quiet')
}

repositories {
    mavenCentral()
}

configurations {
    // Resolves the app-only dependencies below so appJar can bundle them. Kept separate from
    // the declarable compileOnly configuration it extends, because a single configuration
    // shouldn't be both declarable and resolvable.
    appRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom compileOnly
    }
}

dependencies {
    // No slf4j or commons-codec type appears in TivoLibre's public signatures, so consumers
    // get these at runtime without compiling against them.
    implementation 'org.slf4j:slf4j-api:2.0.19'
    implementation 'commons-codec:commons-codec:1.22.1'

    // Only DecoderApp needs these. Declaring them compileOnly bundles them into
    // TivoDecoder.jar while keeping them out of the library's POM, so embedding TivoLibre
    // doesn't drag in a logging backend or an argument parser.
    compileOnly 'commons-cli:commons-cli:1.11.0'
    compileOnly 'ch.qos.logback:logback-classic:1.6.3'

    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.6.3'
}

tasks.named('test') {
    useJUnit()

    // TivoDecoder.VERSION has to match the version above; VersionTest asserts it.
    systemProperty 'project.version', project.version.toString()

    // TivoDecoderTest decodes a real recording end to end. Supply testFile, outFile and mak
    // (on the command line as -PtestFile=... or in gradle.properties) to run it; without them
    // the rest of the suite still runs.
    def sampleFile = providers.gradleProperty('testFile')
    def sampleOut = providers.gradleProperty('outFile')
    def sampleMak = providers.gradleProperty('mak')
    def hasSample = sampleFile.present && sampleOut.present && sampleMak.present

    if (hasSample) {
        systemProperty 'testFile', sampleFile.get()
        systemProperty 'outFile', sampleOut.get()
        // Deliberately never logged: the MAK is a secret.
        systemProperty 'mak', sampleMak.get()
    } else {
        exclude '**/TivoDecoderTest.class'
    }

    def sampleDescription = hasSample
            ? "Running end-to-end tests on '${sampleFile.get()}'."
            : 'Skipping TivoDecoderTest: set testFile, outFile and mak to run it.'
    doFirst {
        logger.lifecycle(sampleDescription)
    }

    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

tasks.register('appJar', Jar) {
    group = 'build'
    description = 'Builds the runnable command line app with its dependencies bundled.'
    archiveFileName = 'TivoDecoder.jar'
    // Dependency jars overlap on shared metadata paths; keep the first copy of each entry
    // rather than writing duplicates. Closes #26.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Main-Class': 'net.straylightlabs.tivolibre.DecoderApp',
                'Implementation-Title': 'TivoLibre',
                'Implementation-Version': project.version
        )
    }

    from sourceSets.main.output
    from('src/main/app-resources') {
        include '*.xml'
    }
    from({
        (configurations.runtimeClasspath + configurations.appRuntime).collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }) {
        // Jar signatures don't survive repackaging, and every dependency brings its own
        // manifest, licence files and module descriptor. META-INF/services must stay: that is
        // how slf4j 2.x discovers the logback binding.
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.EC'
        exclude 'META-INF/MANIFEST.MF', 'META-INF/INDEX.LIST'
        exclude 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES'
        exclude 'META-INF/versions/**'
        exclude 'module-info.class'
    }
}

tasks.named('assemble') {
    dependsOn 'appJar'
}

// Read by the release workflow, which refuses to publish if the tag and this disagree.
tasks.register('printVersion') {
    group = 'help'
    description = 'Prints the project version.'
    def version = project.version.toString()
    doLast {
        println version
    }
}

// Also read by the release workflow, so the notes it writes cannot drift from the coordinate.
tasks.register('printGroup') {
    group = 'help'
    description = 'Prints the project group.'
    def projectGroup = project.group.toString()
    doLast {
        println projectGroup
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'TivoLibre'
                description = project.description
                // This artifact is built from the fork, so point at where its source actually
                // lives. The upstream project is credited under developers below.
                url = 'https://github.com/lart2150/tivolibre'
                packaging = 'jar'

                licenses {
                    license {
                        name = 'GNU General Public License (GPL)'
                        url = 'http://www.gnu.org/licenses/gpl.txt'
                    }
                }

                developers {
                    developer {
                        id = 'fflewddur'
                        name = 'Todd Kulesza'
                        email = 'todd@dropline.net'
                        roles = ['Original author']
                    }
                    developer {
                        id = 'lart2150'
                        name = 'Brian Engert'
                        roles = ['Fork maintainer']
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/lart2150/tivolibre.git'
                    developerConnection = 'scm:git:https://github.com/lart2150/tivolibre.git'
                    url = 'https://github.com/lart2150/tivolibre.git'
                }
            }
        }
    }

    repositories {
        // A plain Maven layout written to the build directory. The release workflow commits this
        // to the "maven" branch, where raw.githubusercontent.com serves it as a repository that
        // consumers can read without authenticating. See the README.
        maven {
            name = 'localRepo'
            url = layout.buildDirectory.dir('maven-repo')
        }

        // GitHub Packages. Publishing needs GITHUB_TOKEN, and unlike the maven branch above,
        // *reading* from here requires a token too, even for a public repository.
        maven {
            name = 'githubPackages'
            url = 'https://maven.pkg.github.com/lart2150/tivolibre'
            credentials {
                username = providers.gradleProperty('githubUser')
                        .orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrElse('')
                password = providers.gradleProperty('githubToken')
                        .orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrElse('')
            }
        }

        maven {
            name = 'central'
            // OSSRH (oss.sonatype.org) reached end of life on 2025-06-30, so the URL this
            // build used to point at no longer resolves. This is Sonatype's
            // Nexus-2-compatible endpoint for the Central Portal; override with
            // -PpublishUrl=... to publish somewhere else.
            url = providers.gradleProperty('publishUrl').getOrElse(
                    'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')
            credentials {
                username = providers.gradleProperty('ossrhUsername').getOrElse('')
                password = providers.gradleProperty('ossrhPassword').getOrElse('')
            }
        }
    }
}

signing {
    // Only Maven Central requires signatures. Publishing to GitHub or to the maven branch, and
    // `gradlew build`, all work without a GPG key present.
    setRequired {
        gradle.taskGraph.allTasks.any { it.name == 'publishMavenJavaPublicationToCentralRepository' }
    }
    sign publishing.publications.mavenJava
}
